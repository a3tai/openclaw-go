name: Release Sync OpenCode

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Tracking issue number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode-release-sync:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'run-a3t') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/a3t release-sync')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
      OPENCODE_AGENT: ${{ vars.OPENCODE_AGENT }}
      OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
      OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
      OPENCODE_MCP_AUTH_JSON: ${{ secrets.OPENCODE_MCP_AUTH_JSON }}
      OPENCODE_PERMISSION: ${{ vars.OPENCODE_PERMISSION }}
      OPENCODE_INSTALL_CMD: ${{ vars.OPENCODE_INSTALL_CMD }}
    steps:
      - name: Resolve tracking issue metadata
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let issueNumber;
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = Number(core.getInput('issue_number', { required: true }));
            } else {
              issueNumber = context.payload.issue.number;
            }

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });

            const title = issue.data.title || '';
            const match = title.match(/v\d+\.\d+\.\d+(?:-\d+)?/);
            if (!match) {
              core.setFailed(`Could not parse release version from issue title: ${title}`);
              return;
            }

            const version = match[0];
            const specPath = `docs/specs/${version}.md`;
            const branchName = `release-sync/${version}`;

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('version', version);
            core.setOutput('spec_path', specPath);
            core.setOutput('branch_name', branchName);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure release labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'upstream-release', color: '0E8A16', description: 'Tracks new openclaw upstream releases' },
              { name: 'release-sync', color: '1D76DB', description: 'Tracks downstream release sync work' },
              { name: 'run-a3t', color: '5319E7', description: 'Trigger OpenCode release-sync workflow' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (err) {
                if (err.status !== 422) {
                  throw err;
                }
              }
            }

      - name: Add labels to tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.meta.outputs.issue_number }}'),
              labels: ['upstream-release', 'release-sync'],
            });

      - name: Install OpenCode CLI
        run: |
          set -euo pipefail
          if command -v opencode >/dev/null 2>&1; then
            echo "OpenCode already installed"
            opencode --version
            exit 0
          fi

          if [ -n "${OPENCODE_INSTALL_CMD:-}" ]; then
            echo "Installing OpenCode via OPENCODE_INSTALL_CMD"
            eval "${OPENCODE_INSTALL_CMD}"
          else
            echo "Installing OpenCode via official install script"
            curl -fsSL https://opencode.ai/install | bash
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify OpenCode CLI
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null 2>&1; then
            echo "::error::OpenCode CLI not found after installation."
            echo "Set OPENCODE_INSTALL_CMD repository variable if your environment needs a custom install method."
            exit 1
          fi
          opencode --version

      - name: Restore OpenCode auth/config secrets
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/opencode"

          if [ -n "${OPENCODE_AUTH_JSON:-}" ]; then
            printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
            chmod 600 "$HOME/.local/share/opencode/auth.json"
            echo "Restored OpenCode provider auth file"
          else
            echo "::warning::OPENCODE_AUTH_JSON is empty; auth may fail for private providers"
          fi

          if [ -n "${OPENCODE_MCP_AUTH_JSON:-}" ]; then
            printf '%s' "$OPENCODE_MCP_AUTH_JSON" > "$HOME/.local/share/opencode/mcp-auth.json"
            chmod 600 "$HOME/.local/share/opencode/mcp-auth.json"
            echo "Restored OpenCode MCP auth file"
          fi

      - name: Build OpenCode prompt
        run: |
          cat > /tmp/release-sync-prompt.md <<'EOF'
          Sync openclaw-go to upstream release `${{ steps.meta.outputs.version }}` using `${{ steps.meta.outputs.spec_path }}`.

          Requirements:
          1. Read the spec file and upstream release notes.
          2. Update `protocol/` and `gateway/` typed surfaces as needed.
          3. Update tests (usually `gateway/methods_test.go`) and `CHANGELOG.md`.
          4. Keep changes minimal and focused to this release.
          5. Do not push directly to main.
          6. Keep review-gate checkboxes in PR body unchecked unless verified by human review.

          After coding, run:
          - `go test ./... -race`

          If no code changes are required for this release, still update `${{ steps.meta.outputs.spec_path }}` to document why.
          EOF

      - name: Run OpenCode release sync
        run: |
          set -euo pipefail

          ARGS=()
          if [ -n "${OPENCODE_MODEL:-}" ]; then
            ARGS+=(--model "${OPENCODE_MODEL}")
          fi
          if [ -n "${OPENCODE_AGENT:-}" ]; then
            ARGS+=(--agent "${OPENCODE_AGENT}")
          fi

          PROMPT_CONTENT="$(cat /tmp/release-sync-prompt.md)"
          opencode run "${ARGS[@]}" "$PROMPT_CONTENT"

      - name: Run validation tests
        run: go test ./... -race

      - name: Create or update release-sync PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.meta.outputs.branch_name }}
          commit-message: "chore(release): sync ${{ steps.meta.outputs.version }} from upstream"
          title: "chore(release): sync ${{ steps.meta.outputs.version }} from upstream"
          labels: |
            upstream-release
            release-sync
          draft: true
          signoff: true
          body: |
            ## Summary
            - automated OpenCode release-sync run for `${{ steps.meta.outputs.version }}`
            - source spec: `${{ steps.meta.outputs.spec_path }}`

            ## Why
            - keep downstream `openclaw-go` release surface aligned with upstream OpenClaw

            ## Validation
            - [x] `go test ./... -race`

            ## Release Review Gates (required for release-sync PRs)
            - [ ] Architecture review
            - [ ] Go standards code review
            - [ ] API coverage review
            - [ ] Security review (Kingpin / @slantview)
            - [ ] Final HITL review

            ## Notes
            - Generated by `release-sync-a3t.yml` (OpenCode runner mode).

      - name: Comment back on tracking issue
        if: steps.cpr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.meta.outputs.issue_number }}');
            const prUrl = '${{ steps.cpr.outputs.pull-request-url }}';
            const version = '${{ steps.meta.outputs.version }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `OpenCode release-sync run completed for ${version}.`,
                `PR: ${prUrl}`,
              ].join('\n'),
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.meta.outputs.issue_number }}');
            const version = '${{ steps.meta.outputs.version }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `OpenCode release-sync run failed for ${version}.`,
                `Run: ${runUrl}`,
                '',
                'Check OpenCode credentials/config in repo secrets/variables (`OPENCODE_CONFIG_CONTENT`, `OPENCODE_MODEL`, optional `OPENCODE_INSTALL_CMD`).',
              ].join('\n'),
            });
