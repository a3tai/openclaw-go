name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Go vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          fail_ci_if_error: false

      - name: Build
        run: go build ./...

      - name: Build examples
        run: go build ./examples/...

  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Smoke test core release packages
        run: go test ./protocol ./gateway ./chatcompletions ./toolsinvoke -race

  release-e2e:
    name: Release E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Start mock server
        run: |
          nohup go run ./examples/server > /tmp/openclaw-mock.log 2>&1 &
          echo $! > /tmp/openclaw-mock.pid

      - name: Wait for server readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null -X POST -H 'Content-Type: application/json' \
              -d '{"model":"openclaw:main","messages":[{"role":"user","content":"ping"}]}' \
              http://localhost:18789/v1/chat/completions; then
              echo "Mock server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Mock server failed to start"
          cat /tmp/openclaw-mock.log || true
          exit 1

      - name: Run example client end-to-end
        run: timeout 90s go run ./examples/client example-token ws://localhost:18789/ws /tmp/openclaw-identity

      - name: Run example chat flow end-to-end
        run: timeout 60s go run ./examples/chat example-token ws://localhost:18789/ws /tmp/openclaw-identity

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/openclaw-mock.log || true

      - name: Stop mock server
        if: always()
        run: |
          if [ -f /tmp/openclaw-mock.pid ]; then
            kill "$(cat /tmp/openclaw-mock.pid)" || true
          fi
  upstream-api-parity:
    name: Upstream API Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Resolve upstream parity target
        id: parity
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          def find_version(text):
              match = re.search(r"v\d+\.\d+\.\d+(?:-\d+)?", text or "")
              return match.group(0) if match else ""

          version = find_version(event.get("pull_request", {}).get("title", ""))

          # On main push, release tags may not exist yet because the publish
          # workflow runs after the merge-triggered CI. Resolve from the merge
          # commit message first, then fall back to the latest reachable tag.
          if not version and event.get("ref") == "refs/heads/main":
              candidates = [
                  event.get("head_commit", {}).get("message", ""),
                  *(commit.get("message", "") for commit in event.get("commits", [])),
              ]
              version = next((v for v in map(find_version, candidates) if v), "")

          if not version and event.get("ref") == "refs/heads/main":
              subprocess.run(["git", "fetch", "--tags", "--force"], check=True)
              version = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "--match", "v*", "--always"],
                  text=True,
              ).strip()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
          PY

      - name: Clone upstream openclaw
        run: |
          git clone https://github.com/openclaw/openclaw /tmp/openclaw
          if [ -n "${{ steps.parity.outputs.version }}" ]; then
            git -C /tmp/openclaw checkout "${{ steps.parity.outputs.version }}"
          fi

      - name: Assert no missing upstream RPC methods
        run: |
          python3 scripts/upstream_drift_report.py \
            --upstream-root /tmp/openclaw \
            --go-root .

  release-diff-coverage:
    name: Release Diff Coverage
    if: github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'docs(spec):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version from PR
        id: release
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          title = event.get("pull_request", {}).get("title", "")
          match = re.search(r"v\d+\.\d+\.\d+(?:-\d+)?", title)
          version = match.group(0) if match else ""

          base_ref = os.environ.get("GITHUB_BASE_REF") or "main"
          subprocess.run(["git", "fetch", "origin", base_ref, "--depth", "1"], check=True)
          diff = subprocess.check_output(
              ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
              text=True,
          ).splitlines()

          if not version:
              for path in diff:
                  m = re.match(r"docs/specs/(v\d+\.\d+\.\d+(?:-\d+)?)\.md$", path)
                  if m:
                      version = m.group(1)
                      break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              if version:
                  out.write(f"enabled=true\nversion={version}\n")
              else:
                  out.write("enabled=false\n")
          PY

      - name: Skip non-release PRs
        if: steps.release.outputs.enabled != 'true'
        run: echo "No release version detected; skipping release diff validation."

      - name: Clone upstream openclaw
        if: steps.release.outputs.enabled == 'true'
        run: |
          git clone https://github.com/openclaw/openclaw /tmp/openclaw
          git -C /tmp/openclaw checkout "${{ steps.release.outputs.version }}"

      - name: Validate release diff coverage
        if: steps.release.outputs.enabled == 'true'
        run: |
          python3 scripts/validate_release_sync.py \
            --upstream-root /tmp/openclaw \
            --go-root . \
            --version "${{ steps.release.outputs.version }}" \
            --output /tmp/release-diff-validation.json

      - name: Show release diff validation report
        if: steps.release.outputs.enabled == 'true'
        run: cat /tmp/release-diff-validation.json
