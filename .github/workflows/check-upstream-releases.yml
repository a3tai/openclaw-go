name: Check Upstream Releases

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

env:
  RESEND_FROM: ${{ secrets.RESEND_FROM_EMAIL }}
  RESEND_TO: ${{ secrets.RESEND_TO_EMAIL }}

jobs:
  check-releases:
    name: Check for new openclaw releases
    runs-on: ubuntu-latest
    steps:
      - name: Create tracking issues for untracked upstream releases
        id: check-releases
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const maxReleasesToScan = 10;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: "openclaw",
                repo: "openclaw",
                per_page: 100,
              },
            );

            const stable = releases
              .filter((r) => !r.draft && !r.prerelease)
              .slice(0, maxReleasesToScan);

            core.info(`Scanned ${stable.length} upstream stable releases.`);

            const labels = [
              { name: "upstream-release", color: "0E8A16", description: "Tracks new openclaw upstream releases" },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: repoOwner,
                  repo: repoName,
                  ...label,
                });
              } catch (err) {
                if (err.status !== 422) {
                  throw err;
                }
              }
            }

            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: repoOwner,
                repo: repoName,
                state: "all",
                labels: "upstream-release",
                per_page: 100,
              },
            );

            const existingTitles = new Set(existing.map((i) => i.title));
            let created = 0;

            for (const release of stable) {
              const version = release.tag_name;
              const previous = stable.find((r) => new Date(r.published_at) < new Date(release.published_at))?.tag_name || null;
              const compareUrl = previous
                ? `https://github.com/openclaw/openclaw/compare/${previous}...${version}`
                : null;
              const issueTitle = `Upstream release: openclaw ${version}`;
              if (existingTitles.has(issueTitle)) {
                core.info(`Already tracked: ${version}`);
                continue;
              }

              const excerpt = (release.body || "").trim();

              const body = [
                "## Release Notes",
                "",
                `Upstream version: \`${version}\``,
                `Release URL: ${release.html_url}`,
                ...(previous ? [`Previous stable version: \`${previous}\``, `Release diff: ${compareUrl}`] : []),
                "",
                "### Changelog excerpt",
                "```",
                excerpt,
                "```",
                "",
                "### Action items",
                "",
                "- [ ] Create/update `docs/specs/<version>.md`",
                "- [ ] Review changelog for new RPC methods/protocol types",
                "- [ ] Update `protocol/` and `gateway/` typed surfaces as needed",
                "- [ ] Update tests and run `go test ./... -race`",
                "- [ ] Complete review gates (architecture, go standards, api, kingpin security, hitl)",
                "- [ ] Merge PR, tag matching upstream version, and publish release",
              ].join("\n");

              const newIssue = await github.rest.issues.create({
                owner: repoOwner,
                repo: repoName,
                title: issueTitle,
                body,
                labels: ["upstream-release"],
              });

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: repoOwner,
                  repo: repoName,
                  workflow_id: "release-sync-claude.yml",
                  ref: "main",
                  inputs: { issue_number: String(newIssue.data.number) },
                });
                core.info(`Dispatched release-sync for issue #${newIssue.data.number} (${version})`);
              } catch (err) {
                core.warning(`Failed to dispatch release-sync for ${version}: ${err.message}`);
              }

              existingTitles.add(issueTitle);
              created += 1;
              core.info(`Created tracking issue: ${issueTitle}`);
              core.setOutput('new_version', version);
              core.setOutput('issue_url', newIssue.data.html_url);
            }

            core.info(`Done. Created ${created} issue(s)`);
            core.setOutput('created_count', String(created));

      - name: Notify — new upstream release detected
        id: notify-check
        if: steps.check-releases.outputs.created_count != '0' && steps.check-releases.outputs.created_count != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"from":"%s","to":"%s","subject":"[openclaw-go] New upstream release: %s","text":"A new upstream openclaw release has been detected and the sync workflow has been triggered.\n\nVersion: %s\nTracking issue: %s\n\nThe sync PR will be created automatically. You will receive another notification when it is ready for review."}' \
              "$RESEND_FROM" "$RESEND_TO" \
              "${{ steps.check-releases.outputs.new_version }}" \
              "${{ steps.check-releases.outputs.new_version }}" \
              "${{ steps.check-releases.outputs.issue_url }}")"
