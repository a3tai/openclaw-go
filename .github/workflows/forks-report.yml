name: Forks Report

on:
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  forks-report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate forks snapshot
        id: forks
        uses: actions/github-script@v7
        with:
          script: |
            const forks = await github.paginate(github.rest.repos.listForks, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sort: 'newest',
              per_page: 100,
            });

            forks.sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
            const top = forks.slice(0, 30).map((f) => ({
              full_name: f.full_name,
              html_url: f.html_url,
              stargazers_count: f.stargazers_count,
              open_issues_count: f.open_issues_count,
              pushed_at: f.pushed_at,
              default_branch: f.default_branch,
            }));

            core.setOutput('count', String(forks.length));
            core.setOutput('forks_json', JSON.stringify(top));

      - name: Open or update forks report issue
        id: issue
        uses: actions/github-script@v7
        env:
          FORKS_JSON: ${{ steps.forks.outputs.forks_json }}
          FORKS_COUNT: ${{ steps.forks.outputs.count }}
        with:
          script: |
            const title = 'Automation: Forks activity report';
            const rows = JSON.parse(process.env.FORKS_JSON || '[]');
            const total = Number(process.env.FORKS_COUNT || '0');

            const body = [
              '## Forks Activity Snapshot',
              '',
              `- Total forks: **${total}**`,
              `- Included in table: **${rows.length}** most recently pushed`,
              '',
              '| Fork | Last push (UTC) | Stars | Open issues |',
              '|---|---:|---:|---:|',
              ...rows.map((f) => `| [${f.full_name}](${f.html_url}) | ${f.pushed_at} | ${f.stargazers_count} | ${f.open_issues_count} |`),
              '',
              '### Suggested follow-up',
              '- Review top recently pushed forks for API/method additions not present upstream/mainline.',
              '- If meaningful diffs are found, open an `upstream-release` or `release-sync` issue to track adoption.',
              '',
              '_Generated automatically by `forks-report.yml`._',
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = openIssues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated issue #${existing.number}`);
              core.setOutput('issue_number', String(existing.number));
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['release-sync'],
              assignees: ['slantview'],
            });
            core.info(`Created issue #${created.data.number}`);
            core.setOutput('issue_number', String(created.data.number));

      - name: Send forks report email via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${RESEND_FROM_EMAIL:-}" ] || [ -z "${RESEND_TO_EMAIL:-}" ]; then
            echo "Resend secrets not configured; skipping email notification."
            exit 0
          fi

          if [ -z "${ISSUE_NUMBER:-}" ]; then
            echo "Issue number missing; skipping email notification."
            exit 0
          fi

          ISSUE_URL="https://github.com/${REPO}/issues/${ISSUE_NUMBER}"
          SUBJECT="[openclaw-go] Forks activity report"
          BODY="Forks activity report is available: ${ISSUE_URL}"

          curl -sS https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"${RESEND_FROM_EMAIL}\",\"to\":[\"${RESEND_TO_EMAIL}\"],\"subject\":\"${SUBJECT}\",\"text\":\"${BODY}\"}" >/tmp/resend-forks.json
          echo "Sent Resend forks email notification"
